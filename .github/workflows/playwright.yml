name: AI QualityOps Docker CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t ai-qualityops-framework .

    - name: Run Playwright Tests inside Docker
      # '-v' use karke hum Docker ke andar ki report ko bahar nikal rahe hain
      run: docker run --rm -v ${{ github.workspace }}/playwright-report:/app/playwright-report ai-qualityops-framework

    - name: Save HTML Report
      uses: actions/upload-artifact@v4
      if: always() # Agar test fail bhi ho jaye, tab bhi humein report chahiye!
      with:
        name: Playwright-HTML-Report
        path: playwright-report/
        retention-days: 7